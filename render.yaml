# Configuration Render (Blueprint) : New → Blueprint → choisir ce dépôt.
services:
  - type: web
    name: novatrax
    runtime: node
    plan: free
    branch: novatrax-site
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: novatrax
      - key: JWT_SECRET
        generateValue: true
      # Valeurs demandées lors de la création :
      - key: MONGODB_URL
        sync: false
      - key: ADMIN_SETUP_CODE
        sync: false
      - key: LEEKPAY_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
