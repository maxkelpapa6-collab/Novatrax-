# Configuration Render (Blueprint) : New → Blueprint → choisir ce dépôt.
services:
  - type: web
    name: novatrax
    runtime: node
    plan: free
    branch: novatrax-site
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: novatrax
      - key: JWT_SECRET
        generateValue: true
      # Seule valeur demandée à la création : votre code secret administrateur.
      - key: ADMIN_SETUP_CODE
        sync: false
      # À ajouter plus tard dans l'onglet Environment de Render :
      # MONGODB_URL (sinon mode test : données effacées au redémarrage),
      # LEEKPAY_SECRET_KEY, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS.
